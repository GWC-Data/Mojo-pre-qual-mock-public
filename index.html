<style>

 * axes: cool-paper/grotesk/blue · posture: restrained · contrast: pass (the client blue #3B6CF5 is held at L56 instead of L57.8 so white text on it reaches 4.5:1) · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V3 · weakest: V, the shell is the project's own and stays a sidebar; variety comes from recomposed sections (hairline sections, a figures strip, tables first) instead of boxed cards */
/* Hallmark · dismissed 23 · the welcome banner and the sign-in panel are the two declared accent surfaces, one blue hue, a brand moment on a screen where everything else stays paper */
/* Hallmark · answered F4 · the tab fill and the banner button are a segmented control and a near-white action on blue; the one filled accent button per page stays the primary */
/* Hallmark · answered F7 · tabs, tags and role tiles share a raised fill on purpose, one control family, differing by size and state */
/* Hallmark · answered F7: containers differ by role, sections take a hairline, controls take an edge, tinted wells carry state only */
/* Hallmark · reworded "assigned by me" to "assignments" · one sidebar item with in-page tabs replaces two items that repeated the page tabs */
/* Hallmark · dropped "Owner dashboard · Domo" · the embedded Domo dashboard card, its Mojo admin tab and URL form were removed at the owner's request, the owner home page shows recent activity in its place */
/* Hallmark · dropped "84%", "68%", "41%", "5%", "2026", "2027", "2028" · timeline percentages and date ranges moved from the default Projects table to the Cards view and the project page; tables before cards */

:root {
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px; --space-3xl: 96px;

  --shadow-pop: 0 0 0 1px oklch(30% 0.02 265 / 0.1), 0 10px 28px oklch(20% 0.03 265 / 0.16); --shadow-modal: 0 0 0 1px oklch(30% 0.02 265 / 0.1), 0 24px 64px oklch(20% 0.03 265 / 0.3); --shadow-drawer: 0 0 64px oklch(10% 0.03 265 / 0.45); --rule-hair: 1px; --shadow-card: none;

  --ok: var(--color-success); --ok-l: var(--tint-ok); --ok-t: var(--color-success);

/* ---------- base ---------- */

.search { display: flex; align-items: center; gap: var(--space-xs); background: var(--color-paper); border: 1px solid var(--color-edge); border-radius: var(--radius-ctl); padding: 0 var(--space-sm); min-height: var(--ctl); width: 22rem; max-width: 100%; color: var(--color-muted); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: var(--ctl); padding: 0 var(--space-md); border: 1px solid var(--color-edge); background: var(--color-paper); color: var(--color-ink); border-radius: var(--radius-ctl); font-weight: 500; font-size: var(--text-sm); white-space: nowrap; text-decoration: none; cursor: pointer; transition: background-color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out); }

.btn.wide { width: 100%; }

.sb { height: 0.5rem; }

.opt.on { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }

.note { display: flex; gap: var(--space-sm); margin-bottom: var(--space-sm); } .note .av { width: 1.625rem; height: 1.625rem; } .note p { background: var(--color-paper); border-radius: var(--radius-ctl); padding: var(--space-xs) var(--space-sm); margin-top: var(--space-2xs); }

.steps { counter-reset: s; }

/* ---------- modal, toast ---------- */

/* ---------- charts ---------- */

.ch-sub { fill: var(--color-muted); }

.rng { display: inline-flex; align-items: center; gap: var(--space-3xs); padding: var(--space-2xs); background: var(--color-paper-3); border-radius: var(--radius-ctl); max-width: 100%; overflow-x: auto; scrollbar-width: none; } .rng button { border: 0; background: none; min-height: var(--ctl-sm); padding: 0 var(--space-sm); border-radius: var(--radius-ctl); font-size: var(--text-xs); font-weight: 500; color: var(--color-muted); white-space: nowrap; } .rng button.on { background: var(--color-paper); color: var(--color-ink); }
.rng-custom { display: inline-flex; align-items: center; gap: var(--space-xs); padding: var(--space-2xs) var(--space-xs) var(--space-2xs) var(--space-sm); border: 1px solid var(--color-edge); border-radius: var(--radius-ctl); color: var(--color-muted); font-size: var(--text-xs); } .rng-custom .inp { width: 8.75rem; min-height: var(--ctl-sm); font-size: var(--text-xs); } .rng-err { font-size: var(--text-xs); color: var(--color-error); display: inline-flex; gap: var(--space-xs); align-items: center; }
.rvt { padding: var(--space-xs) var(--space-lg) var(--space-lg); } .tl-sum { display: flex; gap: var(--space-xs); flex-wrap: wrap; margin: var(--space-md) 0 var(--space-2xs); } .tl-day { margin-top: var(--space-lg); } .tl-dayhd { display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-md); font-size: var(--text-xs); font-weight: 600; color: var(--color-muted); } .tl-dayhd::after { content: ""; flex: 1; height: 1px; background: var(--color-rule); } .tl-dayhd .n { font-weight: 500; background: var(--color-paper-3); color: var(--color-ink-2); border-radius: var(--radius-pill); padding: 0 var(--space-xs); }
.tl-list { position: relative; padding-left: var(--space-xl); } .tl-list::before { content: ""; position: absolute; left: 0.6875rem; top: var(--space-xs); bottom: calc(-1 * var(--space-xs)); width: 1px; background: var(--color-rule); } .tl-item { position: relative; margin-bottom: var(--space-md); }
.tl-dot { position: absolute; left: calc(-1 * var(--space-xl)); top: var(--space-md); width: 1.5rem; height: 1.5rem; border-radius: 50%; display: grid; place-items: center; color: var(--color-paper); box-shadow: 0 0 0 4px var(--color-paper); } .tl-dot.ok { background: var(--color-success); } .tl-dot.bad { background: var(--color-error); } .tl-dot svg.i { width: 0.8125rem; height: 0.8125rem; }
.tl-card { border-top: 1px solid var(--color-rule); padding: var(--space-md) 0; } .tl-hd { display: flex; align-items: center; gap: var(--space-sm); } .tl-hd .meta { min-width: 0; flex: 1; } .tl-hd .meta b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .tl-hd .meta small { color: var(--color-muted); } .tl-badges { display: flex; align-items: center; gap: var(--space-xs); flex-wrap: wrap; justify-content: flex-end; } .tl-time { font-size: var(--text-xs); color: var(--color-muted); font-variant-numeric: tabular-nums; } .tl-q { font-size: var(--text-sm); font-weight: 600; margin: var(--space-sm) 0; } .tl-box { border-radius: var(--radius-ctl); padding: var(--space-sm); background: var(--color-paper-2); } .tl-lbl { font-size: var(--text-xs); font-weight: 500; color: var(--color-muted); margin-bottom: var(--space-3xs); } .tl-fb { margin-top: var(--space-xs); background: var(--color-paper-2); } .tl-ft { display: flex; align-items: center; gap: var(--space-xs); margin-top: var(--space-sm); padding-top: var(--space-sm); font-size: var(--text-xs); color: var(--color-muted); }
.logtbl { table-layout: fixed; } .logtbl .c-date { width: 7.75rem; } .logtbl .c-when { width: 5.25rem; } .logtbl .c-cat { width: 9.75rem; } .logtbl .c-by { width: 13.75rem; } .logtbl .b.cat { min-width: 8rem; justify-content: center; } .logtbl .msg { font-weight: 500; } .logtbl .sub { display: flex; align-items: center; gap: var(--space-xs); margin-top: var(--space-2xs); font-size: var(--text-xs); color: var(--color-muted); } .logtbl .dayrow td { background: var(--color-paper-2); padding: var(--space-xs) var(--space-md); font-size: var(--text-xs); font-weight: 600; color: var(--color-muted); } .logtbl .dayrow .n { font-weight: 500; margin-left: var(--space-xs); } .logtbl .tm { font-variant-numeric: tabular-nums; color: var(--color-muted); } .logtbl .who { display: flex; align-items: center; gap: var(--space-xs); min-width: 0; } .logtbl .who span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree { display: grid; gap: var(--space-sm); } .gcard { overflow: hidden; } .ghd.click { cursor: pointer; } .car { display: inline-flex; color: var(--color-muted); } .car.open { transform: rotate(90deg); }
.gnode { padding: var(--space-sm) 0; } .pnode { margin-top: var(--space-sm); border-left: 1px solid var(--color-rule); padding-left: var(--space-md); } .phd { display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-2xs) 0; } .tnode { margin: var(--space-xs) 0; padding: var(--space-sm) 0; border-bottom: 1px solid var(--color-rule); } .trow { display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; cursor: pointer; } .tq { display: flex; gap: var(--space-xs); flex-wrap: wrap; margin-top: var(--space-xs); }
.qchip { display: inline-flex; align-items: center; gap: var(--space-xs); background: var(--color-paper-2); border-radius: var(--radius-pill); padding: var(--space-3xs) var(--space-sm) var(--space-3xs) var(--space-3xs); font-size: var(--text-xs); color: var(--color-ink); cursor: pointer; text-decoration: none; } .qchip:hover { background: var(--color-paper-3); text-decoration: none; }

/* ---------- responsive ---------- */
@media (max-width: 90rem) { .search { width: 16rem; } }
@media (max-width: 80rem) { .wspill { display: flex; } }
@media (max-width: 68.75rem) { .g4, .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g21, .g12 { grid-template-columns: minmax(0, 1fr); } .grid.g4>.fig:nth-child(odd) { border-left: 0; padding-left: 0; } .grid.g4>.fig:nth-child(n+3) { border-top: 1px solid var(--color-rule); } }

  .side.open { transform: none; box-shadow: var(--shadow-drawer); }

}
@media (max-width: 51.25rem) {
  .authwrap { grid-template-columns: minmax(0, 1fr); } .authl { display: none; } .authr { padding: var(--space-lg) var(--space-md); min-height: 100dvh; align-items: start; } .mlogo { display: flex; }
  .g2, .form { grid-template-columns: minmax(0, 1fr); } .content { padding-inline: var(--space-md); }
  .top { height: auto; min-height: var(--top-h); flex-wrap: wrap; padding: var(--space-xs) var(--space-md); gap: var(--space-xs); }
  .top .search { order: 10; flex: 1 0 100%; width: 100%; } .kbd, .menubtn { display: none !important; }
  .me>div:not(.av):not(.menu), .me>svg { display: none; }
  .top .menu { position: fixed !important; left: var(--space-sm) !important; right: var(--space-sm) !important; top: 4.5rem !important; width: auto !important; min-width: 0; max-height: 70dvh; overflow: auto; }

/* charts */
function lineChart(data,labels,color='var(--color-accent)',h=190){
 const w=520,p=28,mx=Math.max(...data,1)*1.15,n=data.length;
 const x=i=>p+i*(w-p*2)/(n-1),y=v=>h-24-(v/mx)*(h-44);
 const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
 let g='';for(let i=0;i<=4;i++){const yy=h-24-i*(h-44)/4;g+=`<line class="ch-grid" x1="${p}" x2="${w-p}" y1="${yy}" y2="${yy}"/><text class="ch-axis" x="${p-8}" y="${yy+4}" text-anchor="end">${Math.round(mx*i/4)}</text>`}
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Trend over the last six months">${g}<polyline points="${pts}" fill="none" style="stroke:${color}" stroke-width="2.5" stroke-linejoin="round"/>${data.map((v,i)=>`<circle class="ch-dot" cx="${x(i)}" cy="${y(v)}" r="3.5" style="stroke:${color}" stroke-width="2"><title>${labels[i]}: ${v}</title></circle>`).join('')}${labels.map((l,i)=>`<text class="ch-axis" x="${x(i)}" y="${h-6}" text-anchor="middle">${l}</text>`).join('')}</svg>`;
}
function donut(segs,center=''){
 if(!segs.reduce((a,x)=>a+x.v,0))return '<div class="muted" style="padding:var(--space-xl);text-align:center;width:100%">No data yet</div>';
 const tot=segs.reduce((a,s)=>a+s.v,0);let a0=-Math.PI/2;const R=62,r=42,c=80;
 const paths=segs.map(s=>{const a1=a0+s.v/tot*Math.PI*2;const large=a1-a0>Math.PI?1:0;const P=(R_,a)=>`${c+R_*Math.cos(a)},${c+R_*Math.sin(a)}`;
  const d=`M${P(R,a0)} A${R},${R} 0 ${large} 1 ${P(R,a1-.02)} L${P(r,a1-.02)} A${r},${r} 0 ${large} 0 ${P(r,a0)}Z`;a0=a1;return `<path d="${d}" style="fill:${s.c}"><title>${s.l}: ${s.v}</title></path>`}).join('');
 return `<div class="row wrap" style="gap:var(--space-lg);justify-content:center;min-height:14rem"><svg viewBox="0 0 160 160" width="150" role="img" aria-label="${center} by status">${paths}<text class="ch-ink" x="80" y="78" text-anchor="middle" font-size="24" font-weight="600">${tot}</text><text class="ch-sub ch-axis" x="80" y="95" text-anchor="middle">${center}</text></svg><div style="display:grid;gap:var(--space-xs)">${segs.map(s=>`<div class="row sm"><i style="width:0.625rem;height:0.625rem;border-radius:var(--space-3xs);background:${s.c}"></i>${s.l}<b style="margin-left:auto;padding-left:var(--space-lg)">${s.v}</b></div>`).join('')}</div></div>`;
}
function bars(items,max,color='var(--color-accent)'){
 return `<div style="display:grid;gap:var(--space-sm)">${items.map(i=>`<div><div class="row sm" style="margin-bottom:var(--space-2xs)"><span>${i[0]}</span><b class="ml">${i[1]}</b></div><div class="prog"><i style="width:${i[1]/max*100}%;background:${i[2]||color}"></i></div></div>`).join('')}</div>`;
}
function gauge(score,label,big=false){
 const cx=100,cy=100,R=80;const pt=(v,r=R)=>{const a=Math.PI*(1-v/100);return [cx+r*Math.cos(a),cy-r*Math.sin(a)]};
 const arc=(a,b,c)=>{const [x1,y1]=pt(a),[x2,y2]=pt(b);return `<path d="M${x1},${y1} A${R},${R} 0 0 1 ${x2},${y2}" style="stroke:${c}" stroke-width="16" fill="none"/>`};
 const [nx,ny]=pt(score,62);
 return `<svg viewBox="0 0 200 120" width="100%" role="img" aria-label="${label||'Score'} ${score} out of 100"><g>${arc(0,60,'var(--color-error)')}${arc(60,80,'var(--color-warn)')}${arc(80,100,'var(--color-success)')}</g><line class="ch-needle" x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke-width="3" stroke-linecap="round"/><circle class="ch-needle" cx="${cx}" cy="${cy}" r="6"/><text class="ch-ink" x="${cx}" y="${cy+18}" text-anchor="middle" font-size="${big?22:18}" font-weight="600">${score}</text></svg>`;
}

const CSV_TPL='name,description,address,start_date,end_date\nHarbor Point Tower,Mixed-use tower,"1200 Harbor Blvd, Houston, TX",2026-01-12,2027-11-30\n';
function parseCSV(text){
 const rows=[];let cur=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'&&text[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}
  else if(c==='"')q=true;else if(c===','){cur.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;cur.push(f);f='';if(cur.some(x=>x.trim()))rows.push(cur);cur=[]}
  else f+=c}
 cur.push(f);if(cur.some(x=>x.trim()))rows.push(cur);return rows;
}
function validateRows(rows){

 return rows.slice(1).map((r,i)=>{const g=k=>ix(k)>=0?(r[ix(k)]||'').trim():'';const o={n:i+1,name:g('name'),desc:g('description'),addr:g('address'),start:g('start_date'),end:g('end_date'),errs:[]};

}

 ['gl_exp','wc_exp','bond_exp'].forEach(k=>{if(w[k]&&isNaN(new Date(w[k])))e[k]='Enter a valid date'});
 if(w.phone&&!/^[\d\s().+-]{7,}$/.test(w.phone))e.phone='Enter a valid phone number';
 if(w.web&&!/^https?:\/\/\S+\.\S+/.test(w.web))e.web='Enter a full URL, e.g. https://company.com';

 if(S.role==='owner'||S.role==='mojo')return head('Organization','Company-wide profile for '+meName(),acts)+ban+unsaved+card('Company information',`<div class="form">${ofd('Company name','name',{dis:d})}${ofd('Phone','phone',{dis:d})}${ofd('Address','addr',{dis:d})}${ofd('City','city',{dis:d})}${ofd('State','state',{dis:d})}${ofd('ZIP','zip',{dis:d})}${ofd('Website','web',{dis:d,full:1})}${ofile('Company logo','logo','Logo',d)}</div>`);
 const s=S.step;let body='';

 if(s===2)body=`<div class="form">${[['General Liability','gl'],['Workers\' Comp','wc']].map(x=>`<div class="full"><b>${x[0]}</b></div>${ofd('Carrier',x[1]+'_carrier',{dis:d})}${ofd('Policy #',x[1]+'_policy',{dis:d})}${ofd('Limits',x[1]+'_limits',{dis:d})}${ofd('Expiry',x[1]+'_exp',{dis:d,type:'date',hint:expHint(w[x[1]+'_exp'])})}`).join('')}<div class="full"><b>Umbrella <span class="muted fw">(optional)</span></b></div>${ofd('Carrier','umb_carrier',{dis:d})}${ofd('Limits','umb_limits',{dis:d})}${ofile('Certificate of Insurance (COI)','f_coi','COI',d)}</div>`;
 if(s===3)body=`<div class="form">${ofd('EMR','emr',{dis:d,hint:+w.emr>1?'<span style="color:var(--bad);font-weight:600">Above 1.0 — submissions will be flagged</span>':''})}${ofd('TRIR','trir',{dis:d})}${ofd('DART rate','dart',{dis:d})}${ofd('OSHA recordables (last 5 yrs)','rec',{dis:d})}${ofd('Hours worked (last 3 yrs)','hours',{dis:d,full:1})}${ofile('Safety Manual / OSHA logs','f_safety','Safety Manual',d)}</div>`;
 if(s===4)body=`<div class="form"><div class="fld full"><label>Do you have a Pre-Task Planning program?</label><div class="row">${['Yes','No'].map(x=>`<button class="opt ${w.ptp===x?'on':''}" ${d?'disabled':`data-act="fset" data-path="orgf.ptp" data-v="${x}"`}>${x}</button>`).join('')}</div>${w.ptp==='No'?'<small style="color:var(--color-warn)">Submissions without a PTP program are auto-flagged for reviewers.</small>':''}</div>${w.ptp==='Yes'?ofd('Describe your PTP program','ptpDesc',{ta:1,full:1,dis:d})+ofile('PTP Program Plan','f_ptp','PTP Plan',d):''}</div>`;
 if(s===5)body=`<div class="form">${ofd('Bonding company','bond_co',{dis:d})}${ofd('Single project limit','bond_single',{dis:d})}${ofd('Aggregate limit','bond_agg',{dis:d})}${ofd('Bond expiry','bond_exp',{dis:d,type:'date',hint:expHint(w.bond_exp)})}${ofile('Bonding Document','f_bond','Bond',d)}</div>`;
 return head('Organization','Company-wide compliance profile — shared across all projects.',acts)+ban+unsaved+
 `<div class="card" style="margin-bottom:18px"><div class="bd row wrap" style="gap:18px"><div class="ring" style="--p:${pct};width:64px;height:64px"><span style="width:50px;height:50px;font-size:14px">${pct}%</span></div><div style="flex:1;min-width:200px"><b>Profile completeness</b><div class="muted sm">${pct>=80?'Great — your profile is ready for submissions.':'Complete more fields so reviewers can approve you faster.'}</div></div>${w.ptp==='No'||+w.emr>1?`<span class="b bad">${w.ptp==='No'?'No PTP program':'High EMR'} — submissions will be flagged</span>`:''}</div></div>`+
 `<div class="steps">${ORGSTEPS.map((x,i)=>`<div class="step ${s===i+1?'on':s>i+1?'done':''}" data-act="step" data-v="${i+1}">${x}${ORGSTEP_KEYS[i+1].some(k=>F.orgerr&&F.orgerr[k])?' <span style="color:var(--bad)">●</span>':''}</div>`).join('')}</div>`+card(ORGSTEPS[s-1],body)+
 `<div class="row mt"><button class="btn" data-act="step" data-v="${Math.max(1,s-1)}" ${s===1?'disabled':''}>← Back</button><button class="btn p ml" data-act="step" data-v="${Math.min(5,s+1)}" ${s===5?'disabled':''}>Next</button></div>`;

const SC_CATS=[['Pre Task Plan',88],['Observation',74],['Responsiveness',91],['Kudos',65],['WPS',82]];
const hashN=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
function scScores(){
 const f=F.sc||(F.sc={proj:'All projects',sub:'All subcontractors',month:'October 2026'});
 const adj=k=>((hashN(f.proj+f.sub+f.month+k)%25)-12);
 const clamp=v=>Math.max(38,Math.min(99,v));
 const cats=SC_CATS.map(c=>[c[0],clamp(c[1]+adj(c[0]))]);
 const overall=Math.round(cats.reduce((a,c)=>a+c[1],0)/cats.length);
 const months=['May','Jun','Jul','Aug','Sep','Oct'];
 return {f,cats,overall,trend:months.map((m,i)=>clamp(overall-10+i*2+((hashN(f.proj+f.sub+m)%7)-3))),months};
}
P.scorecard=()=>{
 const {f,cats,overall,trend,months}=scScores();
 const subs=TRADES.filter(t=>(f.proj==='All projects'||t.proj.includes(f.proj))&&(f.sub==='All subcontractors'||t.n===f.sub));
 return head('Safety Scorecard','Subcontractor safety performance across your projects.','<a class="btn" data-act="scexport">'+I('dl','sm')+' Export CSV</a>')+

 <div class="grid g3"><div class="card" style="grid-row:span 2"><div class="hd"><h2 class="sh">Overall Safety Score</h2></div><div class="bd" style="text-align:center">${gauge(overall,'Overall',true)}<div class="legend" style="justify-content:center"><span><i style="background:var(--color-error)"></i>&lt;60</span><span><i style="background:var(--color-warn)"></i>60–80</span><span><i style="background:var(--color-success)"></i>80+</span></div><div style="margin-top:20px;text-align:left"><b class="sm">MoM trend</b>${lineChart(trend,months,'var(--color-accent)',150)}</div></div></div>
 ${cats.map(c=>card(c[0],`<div class="row"><div style="width:130px">${gauge(c[1],c[0])}</div><div><div class="fw" style="font-size:22px">${c[1]}</div><div class="sm ${c[1]>=80?'up':'dn'}">${c[1]>=80?'▲ +'+(hashN(c[0]+f.proj)%5+1):'▼ −'+(hashN(c[0]+f.sub)%5+1)} vs last month</div></div></div>`)).join('')}</div>
 <div class="grid g2 mt">${card('Score by subcontractor',subs.length?bars(subs.map(t=>[t.n,Math.max(40,Math.min(99,Math.round(100-t.emr*20+(t.ptp?4:-8))+((hashN(t.n+f.month)%7)-3))),t.emr>1?'var(--color-error)':'var(--color-success)']),100):'<div class="muted sm" style="text-align:center;padding:24px">No subcontractors match these filters.</div>')}${card('Overview',subs.length?`<table><thead><tr><th>Subcontractor</th><th>PTP</th><th>Obs.</th><th>Resp.</th><th>Score</th></tr></thead><tbody>${subs.map(t=>{const h=hashN(t.n+f.month+f.proj);const sc=Math.max(40,Math.min(99,Math.round(100-t.emr*20+(t.ptp?4:-8))+(h%7)-3));return `<tr><td><b>${esc(t.n)}</b></td><td>${60+h%35}</td><td>${55+(h>>3)%40}</td><td>${60+(h>>5)%38}</td><td><span class="b ${sc>=80?'ok':sc>=60?'warn':'bad'}">${sc}</span></td></tr>`}).join('')}</tbody></table>`:'<div class="muted sm" style="text-align:center;padding:24px">No data.</div>','',true)}</div>`;
};

/* ---- shared time-range filter (Last 7/30 days, This year, Previous year, All time, Custom) ---- */
const RANGES=[['l7','Last 7 days'],['l30','Last 30 days'],['ytd','This year'],['py','Previous year'],['all','All time'],['custom','Custom range']];
const getR=k=>F[k]||(F[k]={p:'l30',from:'',to:''});
function rangeBounds(r){
 const Y=new Date().getFullYear();
 switch(r.p){
  case 'l7':return [dAgo(7),dAgo(0)];
  case 'l30':return [dAgo(30),dAgo(0)];
  case 'ytd':return [`${Y}-01-01`,dAgo(0)];
  case 'py':return [`${Y-1}-01-01`,`${Y-1}-12-31`];
  case 'custom':return [r.from||'',r.to||''];
  default:return ['',''];
 }
}
const inRange=(date,r)=>{const [a,b]=rangeBounds(r),d=String(date).slice(0,10);if(a&&b&&a>b)return false;return (!a||d>=a)&&(!b||d<=b)};
const shortD=s=>new Date(s+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const rangeSummary=r=>{
 if(r.p==='custom')return (r.from?shortD(r.from):'Beginning')+' – '+(r.to?shortD(r.to):'Today');
 const [a,b]=rangeBounds(r);return r.p==='all'?'All time':shortD(a)+' – '+shortD(b);
};
const dayLabel=d=>{
 const o={weekday:'long',month:'short',day:'numeric'};if(d.slice(0,4)!==String(new Date().getFullYear()))o.year='numeric';
 const f=new Date(d+'T00:00').toLocaleDateString('en-US',o);
 return d===dAgo(0)?'Today, '+f:d===dAgo(1)?'Yesterday, '+f:f;
};
function rangeBar(k){
 const r=getR(k),bad=r.p==='custom'&&r.from&&r.to&&r.from>r.to;
 return `<div class="rng" role="group" aria-label="Time range">${RANGES.map(x=>`<button class="${r.p===x[0]?'on':''}" data-act="fset" data-path="${k}.p" data-v="${x[0]}">${x[0]==='custom'?I('cal','sm'):''}${x[1]}</button>`).join('')}</div>`
 +(r.p==='custom'?`<div class="rng-custom">From ${bin(k+'.from','',{type:'date',rr:1}).replace('class="inp ','class="inp '+(bad?'err ':''))} to ${bin(k+'.to','',{type:'date',rr:1})}</div>${bad?`<span class="rng-err">${I('alert','sm')} End date is before the start date</span>`:''}`:'');
}
const emptyFiltered=(what,k)=>`<div class="empty2"><span class="ico">${I('search')}</span><b>No ${what} match these filters</b><span class="sm">Try a different time range or clear your filters.</span><a class="btn" data-act="mclear" data-k="${k}">Clear filters</a></div>`;
const chipBtn=(on,act,k,v,label,n)=>`<button class="chip ${on?'on':''}" data-act="${act}" data-k="${k}" data-v="${v}">${label}${n==null?'':`<span class="cn">${n}</span>`}</button>`;
const uniq=a=>[...new Set(a)].sort();

 }

});

/* ---- project metrics ---- */
function projStats(p){
 /* Health = what is still unresolved on this project, not what has already been dealt with. */
 const subs=SUBS.filter(s=>s.proj===p.name),asg=ASSIGN.filter(a=>a.proj===p.name);
 const ap=subs.filter(s=>s.status==='Approved').length,rv=subs.filter(s=>['Submitted','Under review'].includes(s.status)).length,ni=subs.filter(s=>s.status==='Needs info').length;
 const live=subs.filter(s=>['Submitted','Under review','Needs info'].includes(s.status));
 const dr=subs.length-ap-rv-ni,flags=live.reduce((a,s)=>a+s.flags.length,0);
 const inf=live.map(subInfo),expired=inf.filter(i=>i.ed!==null&&i.ed<=0).length,missingDocs=inf.filter(i=>i.missing.length).length;
 const open=asg.filter(a=>OPEN_ST.includes(a.status)),overdue=open.filter(a=>dleft(a.due)<0).length;
 const days=dleft(p.end),sd=dueD(p.start),ed=dueD(p.end);
 let behind=0;if(sd&&ed&&ed>sd){const el=Math.max(0,Math.min(100,(NOW-sd)/(ed-sd)*100));behind=Math.round(el-p.pct)}
 const pl=(n,w)=>n+' '+w+(n===1?'':'s');
 const red=[],amb=[];
 if(flags)red.push(pl(flags,'unresolved risk flag'));
 if(overdue)red.push(pl(overdue,'overdue questionnaire'));
 if(expired)red.push(expired===1?'1 submission with expired insurance':expired+' submissions with expired insurance');
 if(behind>25)red.push(behind+' pts behind schedule');
 if(ni)amb.push(ni+' awaiting contractor');
 if(rv)amb.push(rv+' to review');
 if(open.length-overdue>0)amb.push(pl(open.length-overdue,'open questionnaire'));
 if(missingDocs)amb.push(pl(missingDocs,'submission')+' missing documents');
 if(behind>10&&behind<=25)amb.push(behind+' pts behind schedule');
 const R=(l,c,arr)=>[l,c,arr.join(', '),arr];
 const h=p.status==='Completed'?R('Completed','mute',['Project finished']):p.status==='On hold'?R('On hold','warn',['Project paused']):p.status==='Planning'?R('Not started','mute',['Still in planning'])
  :red.length?R('At risk','bad',red.concat(amb)):amb.length?R('Needs attention','warn',amb):R('On track','ok',['No open issues']);
 return {subs,asg,ap,rv,ni,dr,flags,open,overdue,days,h,behind};
}

function segBar(st,legend=true){
 const t=st.ap+st.rv+st.ni+st.dr;
 if(!t)return `<div class="prog sb"></div>${legend?'<div class="sbleg"><span>No submissions yet</span></div>':''}`;
 const seg=[[st.ap,'var(--ok)','Approved'],[st.rv,'var(--info)','In review'],[st.ni,'var(--warn)','Needs info'],[st.dr,'var(--track)','Draft']].filter(x=>x[0]);
 return `<div class="prog sb">${seg.map(x=>`<i style="width:${x[0]/t*100}%;background:${x[1]}" title="${x[2]}: ${x[0]}"></i>`).join('')}</div>${legend?`<div class="sbleg">${seg.map(x=>`<span><i style="background:${x[1]}"></i>${x[0]} ${x[2].toLowerCase()}</span>`).join('')}</div>`:''}`;
}
function nextDue(p){

}

function gsearch(q){
 q=(q||'').trim().toLowerCase();if(!q)return '';
 const m=s=>String(s).toLowerCase().includes(q),out=[];
 if(S.role==='mojo'){
  MOJO_COS.filter(c=>m(c.n)||m(c.loc)).forEach(c=>out.push(['Company',c.n,c.t.toUpperCase()+', '+c.loc,'go:mojo-company/'+encodeURIComponent(c.n),'bldg']));
  Object.keys(DIR).forEach(co=>DIR[co].filter(x=>m(x.n)||m(x.email)).forEach(x=>out.push(['Person',x.n,x.title+', '+co,'act:'+x.n+'|'+co,'user'])));
 }else{
  PROJECTS.filter(p=>m(p.name)||m(p.addr)||m(p.gc)).forEach(p=>out.push(['Project',p.name,p.addr,'go:project/'+p.id,'folder']));
  if(S.role==='owner')GCS.filter(g=>m(g.n)).forEach(g=>out.push(['General Contractor',g.n,g.loc,'go:gc-detail/'+encodeURIComponent(g.n),'hard']));
  if(S.role!=='trade')TRADES.filter(t=>m(t.n)||m(t.t)).forEach(t=>out.push(['Trade',t.n,t.t,'go:trade-detail/'+encodeURIComponent(t.n),'wrench']));
  const seen=new Set();PROJECTS.forEach(pr=>projPeople(pr).forEach(x=>{const k=x.n+'|'+x.co;if(seen.has(k))return;seen.add(k);if(m(x.n)||m(x.title)||m(x.email)||m(x.co))out.push(['Person',x.n,(x.title||x.role)+', '+x.co,'act:'+k,'user'])}));
  if(S.role!=='trade')visT().filter(t=>m(t.n)).forEach(t=>out.push(['Questionnaire',t.n,t.qs+' questions','go:q-builder/'+t.id,'clip']));
  ASSIGN.filter(a=>m(a.q)||m(a.co)).forEach(a=>{const g=asgGo(a);out.push(['Assignment',a.q,a.co+', '+a.proj+', '+a.status,g?'go:'+g:'go:'+(S.role==='trade'?'my-assign':'q-assignments'),'list'])});
  SUBS.filter(s=>m(s.trade)||m(s.proj)).forEach(s=>out.push(['Submission',s.trade+' — '+s.proj,s.status+', '+s.date,'go:submission/'+s.id,'clip']));
  DOCS.filter(d=>m(d.n)||m(d.t)).forEach(d=>out.push(['Document',d.n,d.t,'go:docs','file']));
 }
 if(!out.length)return `<div class="gsempty">No results for “${esc(q)}”</div>`;
 return out.slice(0,10).map(r=>{const a=r[3].startsWith('act:')?`data-act="person" data-v="${esc(r[3].slice(4))}"`:`data-go="${r[3].slice(3)}"`;return `<a ${a}><span class="gsic">${I(r[4],'sm')}</span><span style="min-width:0"><b>${esc(r[1])}</b><small>${r[0]}, ${esc(r[2])}</small></span></a>`}).join('');
}

function mojoCo(name){
 const wss=Object.keys(WS).filter(k=>WS[k].type!=='mojo').map(k=>({k,w:WS[k],d:wsData(k)}));
 const all=new Map(),trades=new Map(),gcs=new Map(),subs=new Map(),asg=new Map();
 wss.forEach(x=>{
  x.d.PROJECTS.forEach(p=>{if(!all.has(p.name))all.set(p.name,{p,owner:(PM[p.name]||{}).owner||(x.w.type==='owner'?x.w.name:'—'),gc:p.gc})});
  x.d.TRADES.forEach(t=>{const e=trades.get(t.n)||{t,proj:new Set()};t.proj.forEach(pn=>e.proj.add(pn));trades.set(t.n,e)});
  x.d.GCS.forEach(g=>{if(!gcs.has(g.n))gcs.set(g.n,g)});
  x.d.SUBS.forEach(s=>{const k=s.proj+'|'+s.trade;if(!subs.has(k))subs.set(k,s)});
  x.d.ASSIGN.forEach(a=>{const k=a.q+'|'+a.co+'|'+a.proj;if(!asg.has(k))asg.set(k,a)});
 });
 const me=trades.get(name);
 const projects=[...all.values()].filter(e=>e.owner===name||e.gc===name||(me&&me.proj.has(e.p.name))).map(e=>({
  ...e,
  trades:[...trades.entries()].filter(([n,t])=>t.proj.has(e.p.name)).map(([n])=>n),
  subs:[...subs.values()].filter(s=>s.proj===e.p.name&&(!me||s.trade===name))
 }));
 const names=new Set(projects.map(x=>x.p.name));
 const net=new Map(),add=(n,role,pn,stat)=>{if(!n||n==='Unassigned'||n==='—'||n===name)return;const e=net.get(n)||{n,role,projects:new Set(),stat:stat||'—'};e.projects.add(pn);if(stat)e.stat=stat;net.set(n,e)};
 projects.forEach(x=>{
  if(x.owner!==name)add(x.owner,'Owner',x.p.name);
  if(x.gc!==name)add(x.gc,'GC',x.p.name,(gcs.get(x.gc)||{}).stat);
  x.trades.forEach(t=>{if(t!==name)add(t,'Trade',x.p.name,(trades.get(t)||{t:{}}).t.stat)});
 });
 const own=gcs.get(name)||(me&&me.t)||null;
 return {projects,network:[...net.values()].map(e=>({...e,projects:e.projects.size})),subs:[...subs.values()].filter(s=>s.trade===name||names.has(s.proj)&&!me),asg:[...asg.values()].filter(a=>a.co===name||a.by===name),own};
}

{

  const list=toReview(),tpls=visT();
  const rev=list.filter(a=>QGROUP(a)==='review').length,wait=list.filter(a=>QGROUP(a)==='waiting').length,over=list.filter(qOver).length,done=list.filter(a=>QGROUP(a)==='done').length;
  const rate=list.length?Math.round(done/list.length*100):0;
  const fig=(t,v,d,k,val)=>`<a class="fig" data-act="${k}" data-k="qf" data-v="${val}"><div class="t">${t}</div><div class="v">${v}</div><div class="d">${d}</div></a>`;
  const v=curTab('qv','subs');
  return head('Questionnaires','What you have sent out, what is back, and what needs you.','<a class="btn" data-go="q-assign">'+I('send','sm')+' Assign</a><a class="btn p" data-go="q-builder">'+I('plus','sm')+' New questionnaire</a>')+
  `<div class="grid g4">${fig('To review',rev,rev?'Submitted, waiting for you':'Nothing waiting','qkpi','review')}${fig('Waiting on companies',wait,over?over+' overdue':'None overdue','qkpi','waiting')}${fig('Completed',done,rate+'% of '+list.length+' sent','qkpi','done')}<a class="fig" data-act="tab" data-k="qv" data-v="tpl"><div class="t">Templates</div><div class="v">${tpls.length}</div><div class="d">${tpls.filter(t=>!t.sys).length} of your own</div></a></div>`+
  `<div class="mt">${tabs('qv',[['subs','Submissions',list.length],['tpl','Templates',tpls.length]])}</div>`+(v==='tpl'?qHubTemplates():(list.length?qHubSubs(list):emptyState('Nothing sent yet','Assign a questionnaire to a company to start collecting answers.','q-assign','Assign questionnaire')));
 };
 P.questionnaires=a=>withCrumb(hub(),'questionnaires',a);
 Object.assign(ACT,{
  qkpi:e=>{S.filter.qf=e.dataset.v;S.filter.qt='all';S.tab.qv='subs';rerender()},
  qfsel:e=>{S.filter.qt=e.value;rerender()},
  qtsubs:e=>{S.filter.qt=e.dataset.v;S.filter.qf='all';S.tab.qv='subs';rerender()},
  qremind:e=>{const a=asgOf(e);if(!a)return;if(!can('q.assign'))return noPerm();const t=todayS();if((a.log||[]).some(x=>x.t===t&&x.txt==='Reminder sent'))return toast('Already reminded today');alog(a,'Reminder sent');toast('Reminder sent to '+a.co)}
 });
}

/* ---------- create a question without leaving the builder ---------- */
function nqModal(){
 const f=F.nq;
 openModal(`<div class="mh"><div style="min-width:0"><h2 class="sh">Create a question</h2><div class="muted sm">It is saved to your question bank and added to this questionnaire.</div></div><a class="btn g sm ml" data-act="closeModal" aria-label="Close">${I('x')}</a></div>
 <div class="mb"><div class="form1">
  <div class="form"><div class="fld"><label for="nq-cat">Category</label><select class="inp" id="nq-cat">${QCATS.map(c=>`<option value="${c[0]}" ${f.cat===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div><div class="fld"><label for="nq-type">Answer type</label><select class="inp" id="nq-type" data-change="nqtype">${QTYPES.map(t=>`<option value="${t[0]}" ${f.type===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></div></div>
  <div class="fld"><label for="nq-text">Question *</label><textarea class="inp ${f.err?'err':''}" id="nq-text" rows="3" placeholder="Enter the question">${esc(f.text)}</textarea>${f.err?`<p class="ferr">${esc(f.err)}</p>`:''}</div>
  ${f.type==='multi_select'?`<div class="fld"><label for="nq-opts">Options <span class="muted fw">(one per line, at least two)</span></label><textarea class="inp" id="nq-opts" rows="4" placeholder="Option A&#10;Option B&#10;Option C">${esc(f.options)}</textarea></div>`:''}
  <div class="fld"><label for="nq-hint">Hint <span class="muted fw">(optional, shown under the question)</span></label><input class="inp" id="nq-hint" value="${esc(f.hint)}"></div>
  <div class="row wrap" style="gap:var(--space-lg)"><label class="chkrow"><input type="checkbox" id="nq-req" ${f.required?'checked':''}> Required</label><label class="chkrow"><input type="checkbox" id="nq-mojo" ${f.mojo?'checked':''}> Requires Mojo review</label></div>
 </div></div>
 <div class="mf"><a class="btn" data-act="closeModal">Cancel</a><a class="btn p" data-act="nqsave">${I('plus','sm')} Save and add to questionnaire</a></div>`);
 const t=document.getElementById('nq-text');if(t&&!f.text)t.focus();
}
function nqRead(){
 const g=id=>document.getElementById(id),f=F.nq;if(!f||!g('nq-text'))return;
 f.cat=g('nq-cat').value;f.type=g('nq-type').value;f.text=g('nq-text').value;f.hint=g('nq-hint').value;f.required=g('nq-req').checked;f.mojo=g('nq-mojo').checked;
 if(g('nq-opts'))f.options=g('nq-opts').value;
}
Object.assign(ACT,{
 nqopen:e=>{const s=F.qb&&F.qb.search||'';F.nq={cat:(F.qb&&F.qb.cat&&F.qb.cat!=='all')?F.qb.cat:'company_info',type:'radio_yes_no',text:e&&e.dataset&&e.dataset.v==='search'?s:'',options:'',hint:'',required:true,mojo:false,err:''};nqModal()},
 nqtype:()=>{nqRead();F.nq.err='';nqModal()},
 nqsave:()=>{
  nqRead();const f=F.nq;if(!f)return;
  const text=f.text.trim(),opts=(f.options||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(!text){f.err='Write the question first';nqModal();return}
  if(f.type==='multi_select'&&opts.length<2){f.err='Add at least two options, one per line';nqModal();return}
  const q=mq(f.cat,text,f.type,{hint:f.hint.trim(),options:f.type==='multi_select'?opts:[],required:!!f.required,mojo:!!f.mojo,global:S.role==='mojo',ws:curKey()});
  BANKQ.push(q);if(F.qb&&!F.qb.sel.includes(q.id))F.qb.sel.push(q.id);
  F.nq=null;closeModal();rerender();toast('Question created and added to your questionnaire');
 }
});

function labelCells(){document.querySelectorAll('.content table').forEach(t=>{const hs=[...t.querySelectorAll('thead th')].map(x=>x.textContent.trim());if(!hs.length)return;t.querySelectorAll('tbody tr').forEach(r=>[...r.children].forEach((c,i)=>{if(c.tagName==='TD'&&!c.hasAttribute('data-label'))c.setAttribute('data-label',hs[i]||'')}))})}
const _obs=new MutationObserver(()=>{labelCells();enhance()});_obs.observe(document.getElementById('root'),{childList:true,subtree:true});_obs.observe(document.getElementById('modal'),{childList:true,subtree:true});
applyTheme();
if(!deepLink())render();
</script>
</body>
