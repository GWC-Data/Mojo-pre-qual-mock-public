<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreQual Pro — UI Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F6;--surface:#fff;--surface2:#F9FAFB;--border:#E5E7EB;--border2:#D1D5DB;
  --text:#0A0A0A;--muted:#6B7280;--faint:#9CA3AF;
  --brand:#3B6CF5;--brand-d:#2d5be0;--brand-l:#eff3fe;--brand-ink:#2449cc;--pink:#E8336D;
  --ok:#0e9f6e;--ok-l:#e3f7ee;--warn:#d98a06;--warn-l:#fff4dc;--bad:#d9382f;--bad-l:#fde8e6;--info:#0e7fd1;--info-l:#e2f1fc;--ai:#3B6CF5;--ai-l:#eff3fe;
  --ok-t:#067a53;--warn-t:#9a6200;--bad-t:#b32a22;--info-t:#0a64a6;--mute-t:#4B5563;--track:#E5E7EB;--unread:#f5f8ff;
  --side:#111827;--side2:#1f2937;--sidetext:rgba(255,255,255,.7);
  --r:12px;--shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:15px;height:15px}
.app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--side);color:var(--sidetext);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 14px;color:#fff;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#3B6CF5,#2449cc);display:grid;place-items:center;color:#fff}
.tenant{margin:4px 14px 10px;padding:10px 12px;background:var(--side2);border:1px solid rgba(255,255,255,.07);border-radius:10px;display:flex;gap:10px;align-items:center;cursor:pointer;position:relative}
.tenant:hover{border-color:rgba(255,255,255,.2)}
.tav{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px;flex:none}
.tenant b{display:block;color:#fff;font-size:13px;line-height:1.2}
.tenant small{font-size:11px;color:var(--sidetext)}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#6b7399;padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--sidetext);font-weight:500;cursor:pointer;position:relative}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(255,255,255,.14);color:#fff}
.nav a.on:before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:#E8336D}
.nav .cnt{margin-left:auto;background:#E8336D;color:#fff;font-size:11px;padding:1px 7px;border-radius:99px}
.sidefoot{padding:14px;border-top:1px solid rgba(255,255,255,.07);font-size:12px}
/* topbar */
.main{display:flex;flex-direction:column;min-width:0}
.top{height:62px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:20}
.search{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:7px 12px;width:340px;color:var(--muted)}
.search input{border:0;background:none;outline:0;flex:1}
.spacer{flex:1}
.persona{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px}
.persona button{border:0;background:none;padding:5px 11px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted)}
.persona button.on{background:var(--brand);color:#fff}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;position:relative;color:var(--muted)}
.iconbtn:hover{background:var(--surface2)}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.me{display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 8px;border-radius:10px;position:relative}
.me:hover{background:var(--surface2)}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.me b{font-size:13px;display:block;line-height:1.2}.me small{color:var(--muted);font-size:11.5px}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 34px rgba(16,20,43,.16);min-width:230px;padding:6px;z-index:50}
.menu a,.menu div.it{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:8px;color:var(--text);cursor:pointer;font-size:13px}
.menu a:hover,.menu div.it:hover{background:var(--surface2)}
.menu hr{border:0;border-top:1px solid var(--border);margin:5px 0}
.menu .h{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 11px 4px}
.content{padding:28px;max-width:1380px;width:100%;margin:0 auto}
/* page head */
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{font-size:23px;letter-spacing:-.02em;line-height:1.2}
.ph p{color:var(--muted);margin-top:3px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.crumb a{color:var(--muted);cursor:pointer}.crumb a:hover{color:var(--brand)}
.actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border2);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.p:hover{background:var(--brand-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{background:var(--surface);border-color:#f3bcb8;color:var(--bad)}.btn.bad:hover{background:var(--bad-l)}
.btn.ai{background:linear-gradient(135deg,#3B6CF5,#2449cc);border:0;color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}.btn.g{border-color:transparent;background:none;color:var(--muted)}
.btn[disabled]{opacity:.5;pointer-events:none}
/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card>.hd h3{font-size:15px;letter-spacing:-.01em}.card>.hd .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card>.bd{padding:20px}.card>.bd.np{padding:0}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.mt{margin-top:18px}
.stat{padding:18px 20px;cursor:pointer;transition:.15s;display:block}
.stat:hover{border-color:#99b0f8;transform:translateY(-1px)}
.stat .t{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500;font-size:13px}
.stat .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-left:auto}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.stat .d{font-size:12px;color:var(--muted);margin-top:2px}
.up{color:var(--ok)}.dn{color:var(--bad)}
/* table */
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:11px 20px;background:var(--surface2);border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap}
td{padding:13px 20px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--surface2)}
.cell{display:flex;align-items:center;gap:11px}
.cell b{display:block;font-weight:600}.cell small{color:var(--muted);font-size:12px}
.sq{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
/* badges */
.b{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b.nodot:before{display:none}
.b.ok{background:var(--ok-l);color:#067a53}.b.warn{background:var(--warn-l);color:#9a6200}.b.bad{background:var(--bad-l);color:#b32a22}.b.info{background:var(--info-l);color:#0a64a6}.b.mute{background:var(--track);color:#555e78}.b.brand{background:var(--brand-l);color:var(--brand-ink)}.b.ai{background:var(--ai-l);color:#7e22ce}
/* tabs & filters */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.tabs .n{background:var(--track);border-radius:99px;font-size:11px;padding:0 7px}
.tabs button.on .n{background:var(--brand-l)}
.toolbar{display:flex;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.chip{border:1px solid var(--border2);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:12.5px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--brand-l);border-color:#c3d0fb;color:var(--brand-ink)}
.inp{border:1px solid var(--border2);background:var(--surface);border-radius:9px;padding:8px 12px;width:100%;outline:0}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,108,245,.18)}
.inp[disabled]{background:var(--surface2);color:var(--muted);cursor:not-allowed}
textarea.inp{min-height:84px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-weight:600;font-size:13px}.fld small{color:var(--muted);font-size:12px}
.form{display:grid;gap:16px;grid-template-columns:repeat(2,1fr)}.form .full{grid-column:1/-1}
/* misc */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:10px;margin-bottom:18px;font-size:13px}
.banner.warn{background:var(--warn-l);color:#7a4e00;border:1px solid #f5d98f}.banner.info{background:var(--info-l);color:#0a4f84;border:1px solid #b4daf5}.banner.bad{background:var(--bad-l);color:#8f1f18;border:1px solid #f3bcb8}.banner.ai{background:var(--ai-l);color:#6b21a8;border:1px solid #dcc0fb}
.prog{height:8px;border-radius:99px;background:var(--track);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.list>div{display:flex;gap:12px;align-items:center;padding:13px 20px;border-bottom:1px solid var(--border)}.list>div:last-child{border:0}
.muted{color:var(--muted)}.sm{font-size:12.5px}.fw{font-weight:600}.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.ml{margin-left:auto}
.steps{display:flex;gap:0;margin-bottom:22px;counter-reset:s}
.step{flex:1;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:3px solid var(--border);color:var(--muted);font-weight:600;cursor:pointer;font-size:13px}
.step:before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-size:12px;flex:none}
.step.on{border-color:var(--brand);color:var(--brand)}.step.on:before{background:var(--brand);color:#fff}
.step.done:before{content:"✓";background:var(--ok);color:#fff}.step.done{border-color:var(--ok)}
.drop{border:2px dashed var(--border2);border-radius:12px;padding:22px;text-align:center;color:var(--muted);background:var(--surface2);cursor:pointer}
.drop:hover{border-color:var(--brand);background:var(--brand-l)}
.file{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.file .fi{width:36px;height:36px;border-radius:8px;background:var(--bad-l);color:var(--bad-t);display:grid;place-items:center;font-size:10px;font-weight:700}
.fi.d{background:var(--info-l)!important;color:var(--info-t)!important}.fi.x{background:var(--ok-l)!important;color:var(--ok-t)!important}
.tl{position:relative;padding-left:22px}.tl>div{position:relative;padding-bottom:16px}
.tl>div:before{content:"";position:absolute;left:-17px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
.tl:before{content:"";position:absolute;left:-13px;top:8px;bottom:12px;width:2px;background:var(--border)}
.q{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:18px 20px;margin-bottom:14px}
.q.flag{border-color:#f0c35a;background:var(--surface)df6}.q.ai{border-color:#d6b6fa}
.q .qh{display:flex;gap:10px;align-items:flex-start}.q .qn{width:26px;height:26px;border-radius:7px;background:var(--track);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.q h4{font-size:14px;font-weight:600}
.opts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.opt{border:1px solid var(--border2);border-radius:9px;padding:7px 16px;background:var(--surface);font-weight:600;font-size:13px}.opt.on{background:var(--brand);border-color:var(--brand);color:#fff}
.opt[disabled]{opacity:.6;pointer-events:none}
.notes{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:12px}
.note{display:flex;gap:10px;margin-bottom:10px}.note .av{width:26px;height:26px;font-size:10px}.note p{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 11px;margin-top:3px}
.modalbg{position:fixed;inset:0;background:rgba(16,20,43,.5);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:620px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal .mh{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center}.modal .mh h3{font-size:17px}
.modal .mb{padding:22px 24px}.modal .mf{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;background:var(--surface2);border-radius:0 0 16px 16px}
#toast{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:10px;z-index:200}
.tst{background:var(--side);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:up .25s}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.sw{width:38px;height:22px;border-radius:99px;background:var(--border2);position:relative;border:0;transition:.15s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:.15s}
.sw.on{background:var(--brand)}.sw.on:after{left:19px}
.chk{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--brand)}
.ring{--p:70;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--track) 0);display:grid;place-items:center;flex:none}
.ring span{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:20px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.authwrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.authl{background:linear-gradient(150deg,#111827,#1e3aaa 60%,#3B6CF5);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.authr{display:grid;place-items:center;padding:40px;background:var(--surface)}
.authl h2{font-size:34px;letter-spacing:-.03em;line-height:1.15;max-width:480px}
.feat{display:flex;gap:12px;margin-top:20px;color:#cfd3f5}
.demo{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;background:var(--side);color:#fff;padding:8px 14px;border-radius:99px;font-size:12px;z-index:90;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.demo a{color:#99b0f8;cursor:pointer}
.qr{width:150px;height:150px;background:conic-gradient(from 0deg,#111 0 25%,#fff 0 50%,#111 0 75%,#fff 0);background-size:20px 20px;border:8px solid #fff;outline:1px solid var(--border);border-radius:6px}
/* ---- forms, auth, invite, bank ---- */
.ferr{color:var(--bad);font-size:12px;margin-top:2px}
.inp.err{border-color:var(--bad);box-shadow:0 0 0 3px rgba(217,56,47,.1)}
.banner.ok{background:var(--ok-l);color:#065f46;border:1px solid #a7e3c9}
.chkrow{display:flex;gap:10px;align-items:center;padding:9px 12px;font-size:13.5px;cursor:pointer;font-weight:500}
.chkrow input{width:16px;height:16px;accent-color:var(--brand);flex:none}
.picker{border:1px solid var(--border);border-radius:10px;max-height:200px;overflow:auto;background:var(--surface)}
.picker .chkrow{border-bottom:1px solid var(--border)}.picker .chkrow:last-child{border:0}.picker .chkrow:hover{background:var(--surface2)}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--track);border-radius:12px;flex-wrap:wrap;max-width:100%}
.seg a,.seg button{display:inline-flex;gap:7px;align-items:center;border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg a:hover,.seg button:hover{color:var(--text)}
.seg .on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(16,20,43,.12)}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rolecard{text-align:left;border:2px solid var(--border);background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;transition:.12s;width:100%}
.rolecard span{font-size:12px;color:var(--muted);font-weight:400}.rolecard:hover{border-color:var(--border2)}
.rolecard.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-ink)}
.rolecard .ric{width:38px;height:38px;border-radius:10px;background:var(--track);color:var(--muted);display:grid;place-items:center;margin-bottom:6px}
.rolecard.on .ric{background:var(--brand);color:#fff}
.lock{display:flex;gap:8px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-weight:600;flex-wrap:wrap}
.form1{display:grid;gap:18px}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 0 6px;text-align:center}
.qrwrap{padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.qrwrap svg{display:block;max-width:100%;height:auto}
.qrempty{text-align:center;padding:30px 10px 10px;color:var(--muted);display:grid;gap:14px;justify-items:center}
.qrempty svg.i{width:48px;height:48px;color:var(--border2)}
.pw{position:relative}.pw .inp{padding-right:44px}
.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);padding:8px;border-radius:8px;display:grid}
.pw .eye:hover{background:var(--surface2)}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.wide{width:100%;justify-content:center;padding:11px 14px;font-size:14px}
.at{font-size:27px;letter-spacing:-.025em;line-height:1.2}
.as{color:var(--muted);margin:6px 0 22px}
.authbox{width:100%;max-width:420px}
.mlogo{display:none;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:26px}
.authl{position:relative;overflow:hidden}
.authl:before{content:"";position:absolute;width:520px;height:520px;right:-200px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(59,108,245,.38),transparent 65%)}
.authl:after{content:"";position:absolute;width:420px;height:420px;left:-160px;bottom:-180px;border-radius:50%;background:radial-gradient(circle,rgba(232,51,109,.22),transparent 65%)}
.authp{color:rgba(255,255,255,.72);margin-top:14px;max-width:440px;font-size:15px}
.featic{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.feat{align-items:center}
.authr{background:linear-gradient(180deg,#fff,#f8f9fd)}
.rules{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px}
.rule{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--muted)}.rule.ok{color:var(--ok-t)}
.divider{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;margin:24px 0 14px}
.divider:before,.divider:after{content:"";flex:1;border-top:1px solid var(--border)}
.demochips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.demochips button{border:1px solid var(--border2);background:var(--surface);border-radius:10px;padding:10px 6px;font-size:12px;font-weight:600;display:grid;gap:4px;justify-items:center;color:var(--muted)}
.demochips button:hover{border-color:var(--brand);background:var(--brand-l);color:var(--brand-ink)}
.rtag{display:flex;gap:8px;align-items:center;background:var(--brand-l);border:1px solid #c3d0fb;color:var(--brand-ink);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:500}
.invbox{background:var(--brand-l);border:1px solid #c3d0fb;border-radius:12px;padding:14px 16px;color:var(--brand-ink);display:grid;gap:4px;font-size:13.5px}
.center-i{text-align:center}
.iconbig{width:60px;height:60px;border-radius:16px;background:var(--brand-l);color:var(--brand);display:grid;place-items:center;margin:0 auto 14px}
.iconbig svg.i{width:28px;height:28px}
.tagpill{display:inline-flex;gap:5px;align-items:center;padding:3px 6px 3px 10px;border-radius:99px;background:var(--track);font-size:12px;font-weight:500}
.tagpill button{border:0;background:none;color:var(--faint);display:grid;padding:0}
.ftchip{border:0;background:var(--track);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--muted)}
.ftchip.on{background:var(--brand);color:#fff}
.qrow{padding:14px 20px;border-bottom:1px solid var(--border)}.qrow:last-child{border:0}
.ibtn{border:0;background:none;color:var(--faint);padding:7px;border-radius:8px;display:grid;cursor:pointer}
.ibtn:hover{background:var(--surface2);color:var(--brand)}.ibtn.on{color:var(--brand)}.ibtn.dng:hover{color:var(--bad);background:var(--bad-l)}
.ibtn[disabled]{opacity:.3;pointer-events:none}
@media(max-width:600px){.rolegrid{grid-template-columns:1fr}.demochips{grid-template-columns:repeat(2,1fr)}.at{font-size:23px}}
@media(max-width:820px){.mlogo{display:flex}.authr{align-items:start;padding:28px 18px}}

/* ---- v3: role picker, workspace pill, search results, impersonation ---- */
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rolepick button{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 12px;transition:.12s}
.rolepick button small{display:block;color:var(--muted);font-weight:400;font-size:11.5px;line-height:1.2}
.rolepick button b{font-size:13px;line-height:1.2;display:block}
.rolepick button .ric{width:32px;height:32px;border-radius:9px;background:var(--track);color:var(--muted);display:grid;place-items:center;flex:none}
.rolepick button:hover{border-color:var(--border2)}
.rolepick button.on{border-color:var(--brand);background:var(--brand-l)}
.rolepick button.on .ric{background:var(--brand);color:#fff}
.wspill{display:flex;gap:8px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:6px 10px;font-weight:600;font-size:12.5px;max-width:320px;color:var(--text)}
.wspill>span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsres{position:absolute;left:-1px;right:-1px;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 36px rgba(16,20,43,.16);z-index:60;overflow:hidden;color:var(--text)}
.gsres:empty{display:none}
.gsres a{display:flex;gap:11px;align-items:center;padding:10px 14px;color:var(--text);cursor:pointer}
.gsres a:hover{background:var(--surface2)}
.gsres small{display:block;color:var(--muted);font-size:12px}
.gsic{width:30px;height:30px;border-radius:8px;background:var(--brand-l);color:var(--brand);display:grid;place-items:center;flex:none}
.gsempty{padding:14px;color:var(--muted);font-size:13px}
.impbar{display:flex;gap:12px;align-items:center;background:var(--surface)4dc;border:1px solid #f5d98f;color:#7a4e00;border-radius:12px;padding:12px 16px;margin-bottom:18px;flex-wrap:wrap}
@media(max-width:820px){.wspill{max-width:150px}.wspill .b{display:none}}
@media(max-width:480px){.wspill{display:none}.rolepick{grid-template-columns:1fr}}

/* ---- responsive ---- */
.menubtn,.scrim{display:none}
.side{height:100vh;height:100dvh}
.card>.bd.np{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cell{min-width:0}.cell>div{min-width:0}
.list>div{flex-wrap:wrap}
.steps{overflow-x:auto}.step{white-space:nowrap}
.demo{flex-wrap:wrap;justify-content:center;max-width:94vw;width:max-content}

@media(max-width:1280px){.search{width:260px}.content{padding:24px}}
@media(max-width:1100px){

}

@media(max-width:820px){
  .g2,.form{grid-template-columns:1fr}
  .content{padding:16px}
  .top{height:auto;flex-wrap:wrap;padding:10px 14px;gap:10px}
  .top .spacer{flex:1}
  .persona{order:5;flex:1 1 auto;overflow-x:auto;justify-content:center}
  .persona button{padding:5px 9px;flex:1}
  .me>div:not(.av):not(.menu),.me>svg{display:none}

  .top .menu{position:fixed!important;left:12px!important;right:12px!important;top:70px!important;width:auto!important;min-width:0;max-height:70vh;overflow:auto}
  .authwrap{grid-template-columns:1fr}.authl{display:none}.authr{padding:24px 16px;min-height:100vh;align-items:start}
  table{min-width:600px}
  th,td{padding:11px 14px}
  .step{padding:10px 12px;flex:0 0 auto}

  .card>.hd{padding:14px 16px;flex-wrap:wrap}.card>.bd{padding:16px}
  .modalbg{padding:10px;align-items:end}.modal{max-height:94vh;border-radius:16px}
  .modal .mf{flex-wrap:wrap}.modal .mf .btn{flex:1;justify-content:center}
  .modal .mh,.modal .mb,.modal .mf{padding-left:16px;padding-right:16px}
  .banner{padding:11px 12px}
  .q{padding:14px}
}
@media(max-width:600px){
  .g4,.g3{grid-template-columns:1fr}
  .g3>.card[style*="grid-row"]{grid-row:auto!important}
  .ph h1{font-size:20px}
  .ph{gap:12px}
  .actions{margin-left:0;width:100%}.actions .btn{flex:1;justify-content:center}
  .stat .v{font-size:24px}
  .toolbar .search{width:100%!important;margin-left:0!important}
  .toolbar .btn.ml{margin-left:0}
  .tst{font-size:13px}#toast{left:12px;right:12px;bottom:70px}
  .demo{bottom:8px;font-size:11px;padding:7px 12px}
  .opts .opt{flex:1;text-align:center}
  .content{padding:14px 12px 90px}
}
@media(hover:none){.btn{min-height:40px}.opt{min-height:40px}.nav a{padding:11px 12px}}
/* ---- polish: workspace card/menu, toasts, mobile stats ---- */

.g2,.g3,.g4,.g21,.g12,.form,.rolegrid{min-width:0}
@media(max-width:1100px){.g21,.g12{grid-template-columns:minmax(0,1fr)}}
@media(max-width:820px){.g2,.form{grid-template-columns:minmax(0,1fr)}}
.tenant>div:nth-child(2){flex:1;min-width:0}

@media(max-width:600px){
 #toast{left:12px;right:12px;top:auto;bottom:14px;transform:none}
 .g4{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px}
 .g3{grid-template-columns:minmax(0,1fr)}

}
/* ===== Color theme: client brand palette (colors only — layout unchanged) + light/dark ===== */
.logo{background:linear-gradient(135deg,#3B6CF5,#2449cc)}
.nav a.on{background:rgba(255,255,255,.14)}
.nav a.on:before{background:#E8336D}
.nav .cnt{background:#E8336D}
.av{background:var(--brand)}
.dot{border-color:var(--surface)}
.b.ok{color:var(--ok-t)}.b.warn{color:var(--warn-t)}.b.bad{color:var(--bad-t)}.b.info{color:var(--info-t)}.b.mute{background:var(--track);color:var(--mute-t)}
.b.brand,.b.ai{color:var(--brand-ink)}
.banner.ai{color:#1e3aaa;border-color:#c3d0fb}
.q.ai{border-color:#c3d0fb}
.btn.ai{background:linear-gradient(135deg,#3B6CF5,#2449cc)}
.b.cb{background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 78%,black)}
html[data-theme=dark] .b.cb{background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 45%,white)}
.themefab{position:absolute;top:16px;right:16px}
.authr{position:relative}
.qrwrap{background:#fff}
.sw:after{background:#fff}
.inp::placeholder,textarea::placeholder{color:var(--faint)}
select.inp option{background:var(--surface);color:var(--text)}
/* ---- dark mode (client: body #0B0F19, cards gray-800, borders gray-700) ---- */
html[data-theme=dark]{color-scheme:dark;
 --bg:#0B0F19;--surface:#1F2937;--surface2:#111827;--border:#374151;--border2:#4B5563;
 --text:#F3F4F6;--muted:#9CA3AF;--faint:#6B7280;
 --brand-d:#5b82f7;--brand-l:rgba(59,108,245,.18);--brand-ink:#9db6fa;
 --ok-l:rgba(34,197,94,.16);--warn-l:rgba(234,179,8,.16);--bad-l:rgba(239,68,68,.16);--info-l:rgba(59,130,246,.18);--ai-l:rgba(59,108,245,.18);
 --ok-t:#4ade80;--warn-t:#facc15;--bad-t:#f87171;--info-t:#93c5fd;--mute-t:#d1d5db;
 --track:#374151;--unread:rgba(59,108,245,.12);--shadow:0 1px 2px rgba(0,0,0,.45)}
html[data-theme=dark] .banner.warn,html[data-theme=dark] .impbar{background:rgba(234,179,8,.12);color:#fde68a;border-color:rgba(234,179,8,.3)}
html[data-theme=dark] .banner.info{background:rgba(59,130,246,.12);color:#bfdbfe;border-color:rgba(59,130,246,.3)}
html[data-theme=dark] .banner.bad{background:rgba(239,68,68,.12);color:#fecaca;border-color:rgba(239,68,68,.3)}
html[data-theme=dark] .banner.ok{background:rgba(34,197,94,.12);color:#bbf7d0;border-color:rgba(34,197,94,.3)}
html[data-theme=dark] .banner.ai{background:rgba(59,108,245,.16);color:#c3d0fb;border-color:rgba(59,108,245,.4)}
html[data-theme=dark] .q.flag{background:rgba(234,179,8,.08);border-color:rgba(234,179,8,.4)}
html[data-theme=dark] .q.ai{border-color:rgba(59,108,245,.5)}
html[data-theme=dark] .btn.bad{border-color:rgba(239,68,68,.4);color:#f87171}
html[data-theme=dark] .btn.bad:hover{background:rgba(239,68,68,.12)}
html[data-theme=dark] .btn.p,html[data-theme=dark] .btn.ok,html[data-theme=dark] .btn.ai{color:#fff}
html[data-theme=dark] .modalbg{background:rgba(0,0,0,.65)}
html[data-theme=dark] .tst{border:1px solid rgba(255,255,255,.12)}
html[data-theme=dark] .authr{background:var(--bg)}
html[data-theme=dark] .note p{background:var(--surface)}
html[data-theme=dark] svg text[fill="#111827"]{fill:#F3F4F6}
html[data-theme=dark] svg line[stroke="#111827"]{stroke:#F3F4F6}
html[data-theme=dark] svg circle[fill="#111827"]{fill:#F3F4F6}
html[data-theme=dark] svg line[stroke="#eceef5"]{stroke:#374151}
html[data-theme=dark] svg circle[fill="#fff"]{fill:#1F2937}
html[data-theme=dark] svg [fill="#98a1b8"]{fill:#9CA3AF}
html[data-theme=dark] .qrwrap svg{fill:#111827}
.tree{display:grid;gap:12px}.gcard{overflow:hidden}
.ghd{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap}.ghd.click{cursor:pointer}.ghd.click:hover{background:var(--surface2)}
.car{display:inline-flex;transition:transform .15s;color:var(--muted)}.car.open{transform:rotate(90deg)}
.gmeta{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}.gmeta span{display:grid;gap:2px}.gmeta small{color:var(--muted);font-size:11px}.gmeta b{font-size:13.5px}
.gnode{border-top:1px solid var(--border);padding:12px 16px 14px 44px;background:var(--surface2)}
.gq{margin-bottom:10px}.pnode{margin-top:10px;border-left:2px solid var(--border2);padding-left:14px}
.phd{display:flex;align-items:center;gap:8px;padding:4px 0}
.tnode{margin:6px 0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}.tq{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;padding:2px 10px 2px 3px;font-size:12px;color:var(--text);background:var(--surface);cursor:pointer}.qchip:hover{border-color:var(--brand)}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:9px;overflow:hidden}.seg button{border:0;background:var(--surface);color:var(--muted);padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer}.seg button.on{background:var(--brand);color:#fff}
@media(max-width:720px){.gmeta{margin-left:0;width:100%;gap:14px}.gnode{padding-left:14px}}
/* ===== Mojo admin: filter bar, timeline, activity log ===== */
.b svg.i{width:13px;height:13px}
.b.lg{padding:3px 11px;font-size:12.5px}
.card{min-width:0}
.fbar{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
.fbar-top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;min-width:0}
.fbar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px 16px}
.fgroups{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;min-width:0}
.fbar-end{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-left:auto}
.fbar .search{width:190px;max-width:100%;padding:6px 12px}
.fbar-count{font-size:12.5px;color:var(--muted);white-space:nowrap}
.fbar-count b{color:var(--text);font-weight:600}
.fgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-right:2px}
.fsel{width:160px!important;text-overflow:ellipsis;padding:7px 30px 7px 12px!important;height:36px;font-size:13px;cursor:pointer}
.fclear{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--brand);background:none;border:0;padding:4px 2px}
.fclear:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;transition:.12s}
.chip:hover{border-color:#99b0f8;color:var(--text)}
.chip .cn{font-size:11px;font-weight:700;background:var(--track);color:var(--mute-t);border-radius:99px;padding:0 7px;line-height:18px;min-width:20px;text-align:center}
.chip.on .cn{background:#fff;color:var(--brand-ink)}
.rng{min-width:0;display:inline-flex;align-items:center;gap:2px;padding:3px;background:var(--track);border-radius:10px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.rng::-webkit-scrollbar{display:none}
.rng button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.rng button:hover{color:var(--text)}
.rng button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(16,20,43,.14)}
.rng-custom{display:inline-flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);color:var(--muted);font-size:12.5px}
.rng-custom .inp{width:140px;padding:5px 8px;border-radius:7px;font-size:13px;border-color:transparent;background:var(--surface2)}
.rng-custom .inp.err{border-color:var(--bad)}
.rng-err{font-size:12px;color:var(--bad-t);display:inline-flex;align-items:center;gap:5px}
.empty2{display:grid;place-items:center;text-align:center;padding:56px 20px;color:var(--muted)}
.empty2 .ico{width:48px;height:48px;border-radius:14px;background:var(--track);display:grid;place-items:center;margin-bottom:12px;color:var(--faint)}
.empty2 b{color:var(--text);font-size:15px;margin-bottom:4px}
.empty2 .btn{margin-top:14px}
.mini{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:none}
/* review timeline */
.rvt{padding:6px 24px 28px}
.tl-sum{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.tl-day{margin-top:20px}
.tl-dayhd{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tl-dayhd:after{content:"";flex:1;height:1px;background:var(--border)}
.tl-dayhd .n{font-weight:600;text-transform:none;letter-spacing:0;background:var(--track);color:var(--mute-t);border-radius:99px;padding:0 8px;line-height:18px}
.tl-list{position:relative;padding-left:38px}
.tl-list:before{content:"";position:absolute;left:11px;top:8px;bottom:-6px;width:2px;background:var(--border);border-radius:2px}
.tl-item{position:relative;margin-bottom:14px}
.tl-item:last-child{margin-bottom:0}
.tl-dot{position:absolute;left:-38px;top:15px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 0 0 4px var(--surface)}
.tl-dot svg.i{width:13px;height:13px;stroke-width:2.4}
.tl-dot.ok{background:var(--ok)}.tl-dot.bad{background:var(--bad)}

.tl-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.tl-ans{background:var(--surface2);border:1px solid var(--border)}
.tl-fb{margin-top:8px;background:var(--surface2);border-left:3px solid var(--border2)}
.tl-fb.ok{border-left-color:var(--ok)}.tl-fb.bad{border-left-color:var(--bad)}
.tl-ft{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);font-size:12px;color:var(--muted)}

.logtbl{table-layout:fixed}
.logtbl td{padding:12px 20px;vertical-align:middle}
.logtbl .c-date{width:124px}.logtbl .c-when{width:84px}.logtbl .c-cat{width:156px}.logtbl .c-by{width:220px}
.logtbl .b.cat{min-width:128px;justify-content:center}
.logtbl .msg{font-weight:500}

.mini.sqr{border-radius:6px;width:18px;height:18px;font-size:8px}
.logtbl tbody tr:not(.dayrow){transition:background .1s}
.logtbl tbody tr:not(.dayrow):hover td{background:var(--surface2)}
.logtbl .dayrow td{background:var(--surface2);padding:8px 20px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.logtbl .dayrow .n{font-weight:600;text-transform:none;letter-spacing:0;margin-left:6px;color:var(--faint)}
.logtbl .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.logtbl .who{display:flex;align-items:center;gap:9px;min-width:0}

/* charts */
function lineChart(data,labels,color='#3B6CF5',h=190){
 const w=520,p=28,mx=Math.max(...data,1)*1.15,n=data.length;
 const x=i=>p+i*(w-p*2)/(n-1),y=v=>h-24-(v/mx)*(h-44);
 const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
 const area=`M${x(0)},${h-24} L${pts.replace(/ /g,' L')} L${x(n-1)},${h-24}Z`;
 let g='';for(let i=0;i<=4;i++){const yy=h-24-i*(h-44)/4;g+=`<line x1="${p}" x2="${w-p}" y1="${yy}" y2="${yy}" stroke="#eceef5"/><text x="${p-8}" y="${yy+4}" font-size="10" fill="#98a1b8" text-anchor="end">${Math.round(mx*i/4)}</text>`}
 return `<svg viewBox="0 0 ${w} ${h}" width="100%"><defs><linearGradient id="lg${color.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#lg${color.slice(1)})"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${data.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"><title>${labels[i]}: ${v}</title></circle>`).join('')}${labels.map((l,i)=>`<text x="${x(i)}" y="${h-6}" font-size="10.5" fill="#98a1b8" text-anchor="middle">${l}</text>`).join('')}</svg>`;
}
function donut(segs,center=''){
 if(!segs.reduce((a,x)=>a+x.v,0))return '<div class="muted" style="padding:34px;text-align:center;width:100%">No data yet</div>';
 const tot=segs.reduce((a,s)=>a+s.v,0);let a0=-Math.PI/2;const R=62,r=42,c=80;
 const paths=segs.map(s=>{const a1=a0+s.v/tot*Math.PI*2;const large=a1-a0>Math.PI?1:0;const P=(R_,a)=>`${c+R_*Math.cos(a)},${c+R_*Math.sin(a)}`;
  const d=`M${P(R,a0)} A${R},${R} 0 ${large} 1 ${P(R,a1-.02)} L${P(r,a1-.02)} A${r},${r} 0 ${large} 0 ${P(r,a0)}Z`;a0=a1;return `<path d="${d}" fill="${s.c}"><title>${s.l}: ${s.v}</title></path>`}).join('');
 return `<div class="row wrap" style="gap:24px;justify-content:center;min-height:230px"><svg viewBox="0 0 160 160" width="150">${paths}<text x="80" y="78" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">${tot}</text><text x="80" y="95" text-anchor="middle" font-size="10" fill="#98a1b8">${center}</text></svg><div style="display:grid;gap:8px">${segs.map(s=>`<div class="row sm"><i style="width:10px;height:10px;border-radius:3px;background:${s.c}"></i>${s.l}<b style="margin-left:auto;padding-left:20px">${s.v}</b></div>`).join('')}</div></div>`;
}
function bars(items,max,color='#3B6CF5'){
 return `<div style="display:grid;gap:12px">${items.map(i=>`<div><div class="row sm" style="margin-bottom:5px"><span>${i[0]}</span><b class="ml">${i[1]}</b></div><div class="prog"><i style="width:${i[1]/max*100}%;background:${i[2]||color}"></i></div></div>`).join('')}</div>`;
}
function gauge(score,label,big=false){
 const cx=100,cy=100,R=80;const pt=(v,r=R)=>{const a=Math.PI*(1-v/100);return [cx+r*Math.cos(a),cy-r*Math.sin(a)]};
 const arc=(a,b,c)=>{const [x1,y1]=pt(a),[x2,y2]=pt(b);return `<path d="M${x1},${y1} A${R},${R} 0 0 1 ${x2},${y2}" stroke="${c}" stroke-width="16" fill="none"/>`};
 const [nx,ny]=pt(score,62);
 return `<svg viewBox="0 0 200 120" width="100%"><g>${arc(0,60,'#ef4444')}${arc(60,80,'#f59e0b')}${arc(80,100,'#10b981')}</g><line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#111827" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="6" fill="#111827"/><text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="${big?22:18}" font-weight="700" fill="#111827">${score}</text></svg>`;
}

function qrSvg(seed,size=200){
 const n=25;let h=2166136261;for(const c of String(seed)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}
 const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};
 const g=Array.from({length:n},()=>Array(n).fill(0)),res=Array.from({length:n},()=>Array(n).fill(0));
 const finder=(ox,oy)=>{for(let y=-1;y<=7;y++)for(let x=-1;x<=7;x++){const X=ox+x,Y=oy+y;if(X<0||Y<0||X>=n||Y>=n)continue;res[Y][X]=1;g[Y][X]=(x>=0&&x<=6&&y>=0&&y<=6&&(x===0||x===6||y===0||y===6||(x>=2&&x<=4&&y>=2&&y<=4)))?1:0}};
 finder(0,0);finder(n-7,0);finder(0,n-7);
 for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!res[y][x])g[y][x]=rnd()>.52?1:0;
 const s=size/n;let r='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(g[y][x])r+=`<rect x="${(x*s).toFixed(2)}" y="${(y*s).toFixed(2)}" width="${(s+.4).toFixed(2)}" height="${(s+.4).toFixed(2)}"/>`;
 return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" fill="#111827" shape-rendering="crispEdges">${r}</svg>`;
}

  <div class="fld"><label>Hint / helper text <span class="muted fw">(optional)</span></label>${bin('bk.form.hint','Shown below the question to guide the respondent')}</div>
  <div class="fld"><label>AI extraction notes <span class="muted fw">(optional, internal — guides document autofill, never shown to the respondent)</span></label>${bta('bk.form.aiNotes','e.g. Check the EMR value in Section 3 of the Loss Runs report, not the summary page',2)}</div>
  <div>${bchk('bk.form.required','Required')}${bchk('bk.form.mojo','Requires Mojo review',1)}</div>
  ${f.mojo?`<div class="fld"><label>Why does this need Mojo review? <span class="muted fw">(optional, shown to the Mojo reviewer and the respondent)</span></label>${bta('bk.form.mojoNote','e.g. High-risk answer that needs a compliance check before it counts as final',2)}</div>`:''}

 const rows=g=>g.qs.map(q=>{

  <div class="row" style="gap:0;flex:none">${q.hint||q.aiNotes||q.mojoNote?`<button class="ibtn" data-act="bkexp" data-id="${q.id}" title="Details">${I(exp?'chevup':'down','sm')}</button>`:''}${editable?`<button class="ibtn ${q.mojo?'on':''}" data-act="bkmojo" data-id="${q.id}" title="${q.mojo?'Disable':'Require'} Mojo review">${I('shield','sm')}</button><button class="ibtn" data-act="bkedit" data-id="${q.id}" title="Edit">${I('edit','sm')}</button>`:''}${q.version>1?`<button class="ibtn" data-act="bkhist" data-id="${q.id}" title="Version history">${I('hist','sm')}</button>`:''}<button class="ibtn" data-act="bkdup" data-id="${q.id}" title="Duplicate as a custom question">${I('copy','sm')}</button>${editable?`<button class="ibtn dng" data-act="bkdel" data-id="${q.id}" title="Delete">${I('trash','sm')}</button>`:''}</div></div></div>`}).join('');

 `<div class="row wrap" style="gap:10px;margin-bottom:16px"><div class="search" style="width:280px;max-width:100%">${I('search','sm')}<input placeholder="Search questions…" data-bind="bk.search" data-rr="focus" value="${esc(b.search)}"></div><div class="row wrap" style="gap:8px"><button class="chip ${b.cat==='all'?'on':''}" data-act="fset" data-path="bk.cat" data-v="all">All</button>${QCATS.map(c=>`<button class="chip ${b.cat===c[0]?'on':''}" data-act="fset" data-path="bk.cat" data-v="${c[0]}">${c[1]}</button>`).join('')}</div></div>

 (groups.length?`<div style="display:grid;gap:16px">${groups.map(g=>`<div class="card"><div class="hd" style="background:var(--surface2);border-radius:12px 12px 0 0;padding:12px 20px">${catBadge(g.c[0])}<span class="muted sm">${g.qs.length} question${g.qs.length===1?'':'s'}</span></div><div>${rows(g)}</div></div>`).join('')}</div>`:`<div class="card"><div class="bd muted" style="text-align:center;padding:40px">No questions found.</div></div>`);
}

/* ============ QUESTIONNAIRE BUILDER ============ */
const CONDT=['radio_yes_no','multi_select'];
P['q-builder']=(id)=>{
 const tpl=id&&TEMPLATES.find(x=>x.id===id);
 const key=tpl?tpl.id:'new';
 if(!F.qb||F.qb._key!==key)F.qb={_key:key,name:tpl?tpl.n:'',desc:tpl?tpl.desc:'',sel:tpl?[...tpl.ids]:[],conds:tpl?JSON.parse(JSON.stringify(tpl.conds)):{},search:'',cat:'all',condFor:null};
 const b=F.qb;
 const sel=b.sel.map(qById).filter(Boolean);
 const avail=visQ().filter(q=>!b.sel.includes(q.id)&&(b.cat==='all'||q.cat===b.cat)&&q.text.toLowerCase().includes((b.search||'').toLowerCase()));
 const ok=b.name.trim()&&sel.length;
 const selRows=sel.map((q,i)=>{
  const elig=sel.slice(0,i).filter(t=>CONDT.includes(t.type));

  <span class="qn" style="width:26px;height:26px;border-radius:7px;background:var(--track);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none">${i+1}</span>
  <div style="flex:1;min-width:0"><div>${esc(q.text)}</div><div class="row wrap" style="margin-top:5px;gap:8px">${catBadge(q.cat)}<span class="muted sm">${tlabel(q.type)}</span>${cd&&tg?`<span class="b brand nodot">Only if “${esc(tg.text.slice(0,26))}${tg.text.length>26?'…':''}” = ${esc(cd.value)}</span>`:''}</div></div>
  ${elig.length?`<button class="ibtn ${cd?'on':''}" data-act="qbcond" data-id="${q.id}" title="Show only if another answer matches">${I('branch','sm')}</button>`:''}<button class="ibtn dng" data-act="qbdel" data-id="${q.id}">${I('x','sm')}</button></div>
  ${b.condFor===q.id?`<div class="notes" style="margin-left:36px"><div class="fld"><label>Show this question only if</label><select class="inp" data-change="condq" data-id="${q.id}"><option value="">Always show</option>${elig.map(t=>`<option value="${t.id}" ${cd&&cd.questionId===t.id?'selected':''}>${esc(t.text)}</option>`).join('')}</select></div>${cd?`<div class="fld" style="margin-top:10px"><label>equals</label><select class="inp" data-change="condv" data-id="${q.id}">${vals.map(x=>`<option ${cd.value===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`:''}</div>`:''}</div>`}).join('');
 return head(tpl?'Edit questionnaire':'New questionnaire','Pick questions from the bank and arrange them in order.',`<a class="btn" data-go="questionnaires">Cancel</a><a class="btn p" data-act="qbsave" ${ok?'':'disabled'}>${I('check','sm')} Save questionnaire</a>`,crumb(['Questionnaires','questionnaires'],[tpl?'Edit':'New questionnaire']))+
 card('Details',`<div class="form"><div class="fld"><label>Questionnaire name *</label>${bin('qb.name','e.g. Standard Pre-Qual 2026',{rr:'focus'})}</div><div class="fld"><label>Description <span class="muted fw">(optional)</span></label>${bin('qb.desc','Describe when to use this questionnaire…')}</div></div>`)+
 `<div class="grid g2 mt">
 <div><div class="row" style="margin-bottom:10px"><b style="font-size:15px">Question bank</b><span class="muted sm ml">${avail.length} available</span></div>
 <div class="row wrap" style="margin-bottom:10px"><div class="search" style="flex:1;min-width:150px">${I('search','sm')}<input placeholder="Search…" data-bind="qb.search" data-rr="focus" value="${esc(b.search)}"></div>${bsel('qb.cat',[['all','All categories'],...QCATS.map(c=>[c[0],c[1]])],{rr:1}).replace('class="inp"','class="inp" style="width:auto"')}</div>
 <div class="card" style="max-height:540px;overflow:auto">${avail.length?avail.map(q=>`<div class="qrow"><div class="row" style="gap:12px"><div style="flex:1;min-width:0"><div>${esc(q.text)}</div><div class="row wrap" style="margin-top:5px;gap:8px">${catBadge(q.cat)}<span class="muted sm">${tlabel(q.type)}</span>${q.mojo?'<span class="b warn nodot">Mojo review</span>':''}</div></div><button class="btn sm" data-act="qbadd" data-id="${q.id}">${I('plus','sm')} Add</button></div></div>`).join(''):'<div class="muted" style="text-align:center;padding:36px">All questions added, or none match.</div>'}</div></div>
 <div><div class="row" style="margin-bottom:10px"><b style="font-size:15px">Selected questions</b><span class="muted sm">(${sel.length})</span>${S.role==='owner'?'<a class="sm fw ml" data-go="bank">Manage bank →</a>':''}</div><div class="card" style="max-height:600px;overflow:auto;min-height:200px">${sel.length?selRows:`<div class="muted" style="text-align:center;padding:50px 20px"><b style="display:block">No questions yet</b><span class="sm">Click “Add” on the left to build your questionnaire</span></div>`}</div></div></div>`;

/* ============ ASSIGN QUESTIONNAIRE ============ */
P['q-assign']=(pid)=>{
 const proj=pid&&PROJECTS.find(p=>p.id===pid);
 const key=proj?proj.id:'';
 if(!F.as||F.as._key!==key)F.as={_key:key,qid:'',scope:'project_all',project:proj?proj.id:'',companies:[],tie:false,due:'',err:''};

 ${!proj&&needProj?`<div class="fld"><label>Project ${a.scope==='project_all'?'*':''}</label>${bsel('as.project',[['','Select a project…'],...PROJECTS.map(p=>[p.id,p.name])],{rr:1})}</div>`:''}
 ${!proj&&a.scope==='company'?`<div class="fld"><label>Companies *</label><div class="picker">${eco.map(c=>`<label class="chkrow"><input type="checkbox" data-act="ftoggle" data-path="as.companies" data-v="${esc(c.n)}" ${a.companies.includes(c.n)?'checked':''}>${c.n}<span class="b mute nodot ml">${c.t}</span></label>`).join('')}</div></div>${bchk('as.tie','Tie to a specific project <span class="muted sm">(otherwise applies across all your projects with them)</span>',1)}`:''}
 <div class="fld"><label>Due date <span class="muted fw">(optional)</span></label>${bin('as.due','',{type:'date'})}</div></div>
 ${a.err?`<p class="ferr" style="margin-top:12px">${a.err}</p>`:''}<div class="row mt"><a class="btn p" data-act="assignsave" ${can?'':'disabled'}>${I('send','sm')} Assign</a><a class="btn" data-go="questionnaires">Cancel</a></div>`)+`</div>`;

/* ============ v3 · HELPERS ============ */
const emptyState=(t,sub,go,btn='Get started')=>`<div class="card"><div class="bd" style="text-align:center;padding:46px 20px"><div class="iconbig">${I('layers')}</div><h3 style="font-size:17px">${t}</h3><p class="muted" style="margin:6px 0 16px">${sub}</p>${go?`<a class="btn p" data-go="${go}">${btn}</a>`:''}</div></div>`;
const dl=(name,text,type='text/csv')=>{try{const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(_){}};
const DEMO_NOW=new Date('2026-11-05');
const daysTo=s=>{if(!s)return null;const d=new Date(s);return isNaN(d)?null:Math.round((d-DEMO_NOW)/864e5)};
const expSoon=()=>DOCS.filter(d=>{const n=daysTo(d.exp);return n!==null&&n<=90});
const myAssign=()=>ASSIGN.filter(a=>a.co===meName());
const toReview=()=>ASSIGN.filter(a=>a.co!==meName());
const OPEN_ST=['Pending','In progress','Needs more info'];
const navCnt=k=>k==='my-assign'?myAssign().filter(a=>OPEN_ST.includes(a.status)).length:k==='mojo-queue'?QUEUE.filter(q=>!q.done).length:0;
const fmtSize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const extOf=n=>{const e=(n.split('.').pop()||'').toUpperCase();return /^DOC/.test(e)?'DOC':e.slice(0,3)};
const shortDate=()=>new Date().toLocaleDateString('en-US',{month:'short',day:'2-digit'});
const confirmBox=(title,msg,act,v,label='Delete')=>openModal(`<div class="mh"><span class="sq" style="background:var(--bad);width:34px;height:34px">${I('alert','sm')}</span><h3>${title}</h3><a class="btn g sm ml" data-act="closeModal">${I('x')}</a></div><div class="mb"><p>${msg}</p></div><div class="mf"><a class="btn" data-act="closeModal">Cancel</a><a class="btn bad" data-act="${act}" data-v="${esc(v)}">${label}</a></div>`);
const blankData=(name,creatorName,creatorEmail,projects=[])=>({PROJECTS:projects,GCS:[],TRADES:[],SUBS:[],ASSIGN:[],TEAM:creatorEmail?[mkT(creatorName,creatorEmail,'Admin','Active','Today')]:[],DOCS:[],NOTIFS:[mkN('Welcome to PreQual Pro — complete your Organization profile to get started','Just now',true,'org')],ORG:mkOrg({name}),CHART:{trend:[0,0,0,0,0,0],split:[0,0,0,0]}});

const CSV_TPL='name,description,address,start_date,end_date\nHarbor Point Tower,Mixed-use tower,"1200 Harbor Blvd, Houston, TX",2026-01-12,2027-11-30\n';
function parseCSV(text){
 const rows=[];let cur=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'&&text[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}
  else if(c==='"')q=true;else if(c===','){cur.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;cur.push(f);f='';if(cur.some(x=>x.trim()))rows.push(cur);cur=[]}
  else f+=c}
 cur.push(f);if(cur.some(x=>x.trim()))rows.push(cur);return rows;
}
function validateRows(rows){
 const hdr=rows[0].map(h=>h.trim().toLowerCase());const ix=k=>hdr.indexOf(k);
 return rows.slice(1).map((r,i)=>{const g=k=>ix(k)>=0?(r[ix(k)]||'').trim():'';const o={n:i+1,name:g('name'),desc:g('description'),addr:g('address'),start:g('start_date'),end:g('end_date'),errs:[]};
  if(!o.name)o.errs.push('Missing name');
  ['start','end'].forEach(k=>{if(o[k]&&isNaN(new Date(o[k]+'T00:00:00')))o.errs.push('Invalid '+k+' date (use YYYY-MM-DD)')});
  if(o.start&&o.end&&!o.errs.length&&o.end<o.start)o.errs.push('End before start');return o});
}

const SC_CATS=[['Pre Task Plan',88],['Observation',74],['Responsiveness',91],['Kudos',65],['WPS',82]];
const hashN=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
function scScores(){
 const f=F.sc||(F.sc={proj:'All projects',sub:'All subcontractors',month:'October 2026'});
 const adj=k=>((hashN(f.proj+f.sub+f.month+k)%25)-12);
 const clamp=v=>Math.max(38,Math.min(99,v));
 const cats=SC_CATS.map(c=>[c[0],clamp(c[1]+adj(c[0]))]);
 const overall=Math.round(cats.reduce((a,c)=>a+c[1],0)/cats.length);
 const months=['May','Jun','Jul','Aug','Sep','Oct'];
 return {f,cats,overall,trend:months.map((m,i)=>clamp(overall-10+i*2+((hashN(f.proj+f.sub+m)%7)-3))),months};
}
P.scorecard=()=>{

/* ---- shared time-range filter (Last 7/30 days, This year, Previous year, All time, Custom) ---- */
const RANGES=[['l7','Last 7 days'],['l30','Last 30 days'],['ytd','This year'],['py','Previous year'],['all','All time'],['custom','Custom range']];
const getR=k=>F[k]||(F[k]={p:'l30',from:'',to:''});
function rangeBounds(r){
 const Y=new Date().getFullYear();
 switch(r.p){
  case 'l7':return [dAgo(7),dAgo(0)];
  case 'l30':return [dAgo(30),dAgo(0)];
  case 'ytd':return [`${Y}-01-01`,dAgo(0)];
  case 'py':return [`${Y-1}-01-01`,`${Y-1}-12-31`];
  case 'custom':return [r.from||'',r.to||''];
  default:return ['',''];
 }
}
const inRange=(date,r)=>{const [a,b]=rangeBounds(r),d=String(date).slice(0,10);if(a&&b&&a>b)return false;return (!a||d>=a)&&(!b||d<=b)};
const shortD=s=>new Date(s+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const rangeSummary=r=>{
 if(r.p==='custom')return (r.from?shortD(r.from):'Beginning')+' – '+(r.to?shortD(r.to):'Today');
 const [a,b]=rangeBounds(r);return r.p==='all'?'All time':shortD(a)+' – '+shortD(b);
};
const dayLabel=d=>{
 const o={weekday:'long',month:'short',day:'numeric'};if(d.slice(0,4)!==String(new Date().getFullYear()))o.year='numeric';
 const f=new Date(d+'T00:00').toLocaleDateString('en-US',o);
 return d===dAgo(0)?'Today · '+f:d===dAgo(1)?'Yesterday · '+f:f;
};
function rangeBar(k){
 const r=getR(k),bad=r.p==='custom'&&r.from&&r.to&&r.from>r.to;
 return `<div class="rng" role="group" aria-label="Time range">${RANGES.map(x=>`<button class="${r.p===x[0]?'on':''}" data-act="fset" data-path="${k}.p" data-v="${x[0]}">${x[0]==='custom'?I('cal','sm'):''}${x[1]}</button>`).join('')}</div>`
 +(r.p==='custom'?`<div class="rng-custom">From ${bin(k+'.from','',{type:'date',rr:1}).replace('class="inp ','class="inp '+(bad?'err ':''))} to ${bin(k+'.to','',{type:'date',rr:1})}</div>${bad?`<span class="rng-err">${I('alert','sm')} End date is before the start date</span>`:''}`:'');
}
const emptyFiltered=(what,k)=>`<div class="empty2"><span class="ico">${I('search')}</span><b>No ${what} match these filters</b><span class="sm">Try a different time range or clear your filters.</span><a class="btn" data-act="mclear" data-k="${k}">Clear filters</a></div>`;
const chipBtn=(on,act,k,v,label,n)=>`<button class="chip ${on?'on':''}" data-act="${act}" data-k="${k}" data-v="${v}">${label}${n==null?'':`<span class="cn">${n}</span>`}</button>`;
const uniq=a=>[...new Set(a)].sort();

function loadCsv(name,text){
 const rows=parseCSV(text);
 if(rows.length<2||!rows[0].map(h=>h.trim().toLowerCase()).includes('name')){F.bulk={file:name,rows:null,err:'This file does not look like a project CSV (missing a "name" column or no rows). Download the template to see the expected format.'};rerender();return}

  const f=t.files&&t.files[0];if(!f)return;

  r.onload=()=>{
   const b=new Uint8Array(r.result),hex=[...b.slice(0,12)].map(x=>x.toString(16).padStart(2,'0')).join('');
   const magic={png:/^89504e47/,jpg:/^ffd8ff/,jpeg:/^ffd8ff/,gif:/^47494638/,webp:/^52494646.{8}57454250/};
   const bad=magic[ext]&&!magic[ext].test(hex);
   t.closest('.drop').insertAdjacentHTML('beforebegin',`<label class="chk"><input type="checkbox" checked data-doc="${esc(f.name)}" data-bad="${bad?1:''}"><div class="fi" style="width:30px;height:30px;border-radius:7px;background:var(--bad-l);color:var(--bad-t);display:grid;place-items:center;font-size:9px;font-weight:700">${extOf(f.name)}</div><div><b class="sm">${esc(f.name)}</b><div class="muted sm">One-off · ${fmtSize(f.size)}${bad?' · <span style="color:var(--bad)">contents do not match the file type — will be skipped</span>':''}</div></div></label>`);
   toast(bad?f.name+' looks corrupted or mislabeled and will be skipped':f.name+' added to this run');

  REVIEW_HISTORY.unshift({id:'h'+Date.now(),co:q.co,proj:q.proj,q:q.q,a:q.a,ai:q.ai,decision:q.done,reviewer:MOJO_ACTOR,fb:q.fb,d:nowStamp().slice(0,10),tm:nowStamp().slice(11)});
  ACTIVITY.unshift({t:nowStamp(),cat:'Review',actor:MOJO_ACTOR,co:q.co,msg:q.done+' answer: '+q.q});
  rerender();toast('Review recorded: '+q.done)}
});

document.addEventListener('click',ev=>{
 const t=ev.target;
 if(t.classList&&t.classList.contains('modalbg')){closeModal();return}
 /* nearest actionable element wins — menu items live inside their own toggle, so order matters */
 const el=t.closest('[data-act],[data-go]');
 if(el){
  if(el.dataset.act==='menu'&&t.closest('.menu'))return;
  if(el.dataset.act&&ACT[el.dataset.act]){ACT[el.dataset.act](Object.assign(el,{target:t}));return}
  if(el.dataset.go){S.menu=null;S.navOpen=false;const p=el.dataset.go;if(location.hash==='#/'+p)render();else go(p);return}
 }
 const gr=document.getElementById('gsres');if(gr&&!t.closest('.search'))gr.innerHTML='';
 if(S.menu&&!t.closest('.menu')){S.menu=null;rerender()}
});
document.addEventListener('input',ev=>{
 const t0=ev.target;
 if(t0.dataset&&t0.dataset.gsearch){const r=document.getElementById('gsres');if(r)r.innerHTML=gsearch(t0.value);return}
 if(t0.dataset&&t0.dataset.bind){
  setP(F,t0.dataset.bind,t0.type==='checkbox'?t0.checked:t0.value);
  if(t0.dataset.bind==='acct.nw'){const r=document.getElementById('acrules');if(r)r.innerHTML=acRules(t0.value)}
  if(t0.dataset.bind==='auth.pass'){const r=document.getElementById('rules');if(r)r.innerHTML=pwRules()}
  if(t0.dataset.rr==='focus'){const pos=t0.selectionStart;rerender();const el=document.querySelector('[data-bind="'+t0.dataset.bind+'"]');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}
  else if(t0.dataset.rr)rerender();
  return}
 const id=ev.target.dataset&&ev.target.dataset.inp;
 if(id){const a=S.respond.answers.find(x=>x.id==id);a.val=ev.target.value;const was=a.src;a.src=ev.target.value?'human':null;
  if(was!==a.src){const pos=ev.target.selectionStart;rerender();const el=document.querySelector(`[data-inp="${id}"]`);if(el){el.focus();el.setSelectionRange(pos,pos)}}}
});
window.addEventListener('hashchange',()=>{if(!AUTH)render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(S.navOpen)ACT.navtoggle()}});
window.matchMedia('(min-width:1025px)').addEventListener('change',e=>{if(e.matches&&S.navOpen)ACT.navtoggle()});
applyTheme();
render();
</script>
